spring.application.name=limbus-gacha-api
server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/limbus?createDatabaseIfNotExist=true&sslMode=${DB_SSL}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true